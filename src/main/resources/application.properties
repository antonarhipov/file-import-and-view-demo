spring.application.name=file-import-and-view-demo
spring.docker.compose.lifecycle-management=start-and-stop

# Explicit PostgreSQL connection settings. Compose publishes this service on localhost:5432.
spring.datasource.url=jdbc:postgresql://localhost:5432/weather
spring.datasource.username=weather
spring.datasource.password=weather
spring.datasource.driver-class-name=org.postgresql.Driver

# The supplied dataset remains an inspectable filesystem input.
weather.import.file=data/amsterdam_weather.csv
weather.import.batch-size=1000
