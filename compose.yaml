services:
  failing-demo:
    image: 'alpine:3.22'
    profiles:
      - failure-demo
    command:
      - /bin/sh
      - -c
      - |
        echo 'Starting failure demonstration...'
        echo 'Performing work before the simulated failure...'
        echo 'The demonstration is now failing intentionally.'
        exit 1

  postgres:
    image: 'postgres:18.6-alpine'
    environment:
      POSTGRES_DB: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_USER: weather
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 5s
      retries: 10
