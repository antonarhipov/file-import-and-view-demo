services:
  postgres:
    image: 'postgres:18.6-alpine'
    environment:
      POSTGRES_DB: weather
      POSTGRES_PASSWORD: weather
      POSTGRES_USER: weather
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 5s
      retries: 10
